# Include ONLY inside the HTTPS server block for chain-of-respon.duckdns.org.
server_tokens off;
client_max_body_size 128k;
client_header_timeout 10s;
client_body_timeout 15s;
send_timeout 30s;
limit_conn cor_lab_connections 200;
limit_req zone=cor_lab_api burst=200 nodelay;
limit_req_status 429;
limit_conn_status 429;
add_header Strict-Transport-Security "max-age=86400" always;

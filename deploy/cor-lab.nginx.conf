# Dedicated HTTP virtual host. Certbot adds HTTPS after HTTP reachability is verified.
server {
    listen 80;
    server_name chain-of-respon.duckdns.org;

    access_log /var/log/nginx/cor-lab.access.log;
    error_log /var/log/nginx/cor-lab.error.log;
    client_max_body_size 128k;
    server_tokens off;
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 30s;
    limit_conn cor_lab_connections 200;
    limit_req_status 429;
    limit_conn_status 429;

    location /api/ {
        limit_req zone=cor_lab_api burst=200 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
